name: checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: extension/.nvmrc
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec eslint src scripts vite.config.ts vite.content.config.ts eslint.config.mjs
      - run: pnpm exec prettier --check .
      - run: pnpm build
